# Copy to sportstaxer.yaml and edit. Every key is optional; omitted keys take the
# defaults in src/sportstaxer/config.py.
fps: 2.0
frames:
  image_format: png
  jpeg_quality: 90
dedup:
  enabled: true
  hash_distance: 4
stitch:
  min_correlation: 0.9
  max_canvas_height: 20000
  segment_overlap: 400
extract:
  backend: anthropic
  money_passes: 2
ledger:
  min_confidence: 0.8
  # assume_year: 2025
work_dir: work
out_dir: out
